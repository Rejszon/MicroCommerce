server:
  port: 8080

spring:
  application:
    name: API-Gateway
  profiles:
    include: secrets
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service-auth
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/auth/**
            - id: user-service-protected
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/users/**
              filters:
                - JwtAuthenticationFilter
management:
  endpoints:
    web:
      exposure:
        include: gateway
logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.cloud.gateway.route.RouteDefinitionLocator: DEBUG
